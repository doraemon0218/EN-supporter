# main へ push するたびに Vercel 本番へデプロイ（GitHub Actions 経由）
#
# 有効化手順:
#   1. GitHub → Settings → Secrets and variables → Actions
#      - Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   2. Variables → New repository variable
#      - Name: VERCEL_DEPLOY_VIA_ACTIONS  Value: true
#   3. Vercel ダッシュボードで「Git の自動デプロイ」をオフにする（Actions と二重になるのを防ぐ）
#
# Secrets 未設定のままではジョブはスキップされ、他の開発者の push で CI が落ちません。

name: Deploy Vercel (production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    if: vars.VERCEL_DEPLOY_VIA_ACTIONS == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
